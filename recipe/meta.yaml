{% set name = "python-socketio" %}
{% set version = "5.18.0" %}
{% set ignore_redis_tests = [
  "--ignore=tests/async/test_redis_manager.py",
  "--ignore=tests/common/test_redis_manager.py"
] %}

# E   ModuleNotFoundError: No module named 'valkey'
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 81ec0fbc34b82009272834145a8fab82ccc36eb057eb2c3798dfe253fa47ed72

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - python
    - setuptools >=61.2
  run:
    - python
    - bidict >=0.21.0
    - python-engineio >=4.15.1
  run_constrained:
    - requests >=2.21.0
    - websocket-client >=0.54.0
    - aiohttp >=3.4

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - socketio
    - socketio.base_manager
    - socketio.kombu_manager
    - socketio.middleware
    - socketio.namespace
    - socketio.packet
    - socketio.pubsub_manager
    - socketio.redis_manager
    - socketio.server
  requires:
    - pip
    - simple-websocket
    - uvicorn
    - requests
    - websocket-client
    - aiohttp
    - pytest
    - msgpack-python
    - pytest-asyncio
    - pytest-timeout
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ ignore_redis_tests | join(" ")}}

about:
  home: https://github.com/miguelgrinberg/python-socketio
  license_file: LICENSE
  license: MIT
  license_family: MIT
  summary: Python implementation of the Socket.IO realtime client and server.
  description: |
    This projects implements Socket.IO clients and servers that can run
    standalone or integrated with a variety of Python web frameworks.
  doc_url: https://python-socketio.readthedocs.io
  dev_url: https://github.com/miguelgrinberg/python-socketio

extra:
  recipe-maintainers:
    - pmlandwehr
    - ReimarBauer
